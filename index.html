<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Driftplanering – utbildningsmodell</title>
  <link rel="stylesheet" href="app/style.css">
  <link rel="stylesheet" href="app/planering.css">
</head>
<body>
  <header class="topp">
    <div class="logo">Driftplanering <span>utbildningsmodell</span></div>
    <label class="byggval">Byggnad
      <select id="byggnad"></select>
    </label>
    <!-- Mediaspelaren har en fast plats högst upp och är gemensam för alla tre huvudsteg
         (beslut 82). Den ritas av app/spelare.js. -->
    <div id="spelare" class="spelare"></div>
  </header>

  <div class="layout">
    <aside class="sidopanel">
      <nav class="processlinje" id="processlinje"></nav>
      <div class="pl-rad">
        <button id="ordlista-knapp" class="knapp sekundar liten-knapp" title="Slå upp ett begrepp utan att lämna steget du står i">Ordlista</button>
      </div>
      <section id="hs-byggnad" class="hs-innehall" hidden>
        <!-- Byggnadsflödet: fyra steg i en lodrät lista som Planeringens (beslut 69 och 107).
             Byggnadsträdet ligger under flödet, som den färdiga byggnadens innehåll. -->
        <div id="byggnadsflode"></div>
        <div id="trad"></div>
      </section>
      <section id="hs-planering" class="hs-innehall"><div id="flode"></div></section>
      <section id="hs-balansering" class="hs-innehall" hidden>
        <div id="balansering"></div>
      </section>
    </aside>

    <div class="mitten">
      <main id="vy">
        <div id="vy3d"></div>

        <div class="verktyg">
          <div class="grupp">
            <span class="grupp-namn">Visa</span>
            <button id="t-ytter" class="chip">Ytterväggar</button>
            <button id="t-inner" class="chip">Innerväggar</button>
            <button id="t-tak" class="chip">Tak</button>
            <button id="t-etikett" class="chip">Rumsnamn</button>
            <button id="t-rontgen" class="chip" title="Signifikanta installationer syns genom väggar och tak">Röntgen</button>
          </div>
          <div class="grupp">
            <span class="grupp-namn">Plan</span>
            <span id="planknappar"></span>
          </div>
          <div class="grupp">
            <span class="grupp-namn">Vy</span>
            <button id="v-oversikt" class="chip">Översikt</button>
            <button id="v-uppifran" class="chip">Uppifrån</button>
          </div>
        </div>

        <div id="rumlage" class="rumlage" hidden>
          <span id="rumlage-namn"></span>
          <button id="lamna-rum" class="knapp">Lämna rummet (Esc)</button>
        </div>

        <!-- Beskedet när byggnaden inte har några plan ännu: modellen växer fram med
             stegen (beslut 111), och en tom ruta utan förklaring ser ut som ett fel. -->
        <div id="tom-byggnad" class="tom-byggnad" hidden></div>

        <div id="telefoner" class="telefoner"></div>
        <div id="infokort" class="infokort" hidden></div>
        <div id="tips" class="tips" hidden></div>

        <div class="nederkant">
          <div id="forklaring" class="forklaring"></div>
          <div class="hjalp">Dra: rotera · Scroll: zoom · Högerdra: panorera · Dubbelklicka på ett golv: gå in i rummet</div>
        </div>
      </main>
      <section id="tidsaxel" class="tidsaxel"></section>
      <section id="balansering-yta" class="balansering-yta"></section>
    </div>
  </div>

  <div id="kontextmeny" class="kontextmeny" hidden></div>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <!-- SheetJS (0.20.3, Apache 2.0) läser och skriver inläsningsfilens .xlsx från file://
       utan server. Mini-bygget: det läser och skriver .xlsx, som är formatet både Excel och
       Numbers exporterar till, och är en tredjedel så stort som det fulla. -->
  <script src="vendor/xlsx.mini.min.js"></script>
  <script src="data/hangar.js"></script>
  <script src="data/katalog.js"></script>
  <script src="data/rumstyper.js"></script>
  <script src="data/tidsschablon.js"></script>
  <script src="data/ordlista.js"></script>
  <script src="data/garage.js"></script>
  <script src="data/kasern.js"></script>
  <script src="app/balansering.js"></script>
  <script src="app/planlosning.js"></script>
  <script src="app/inlasning.js"></script>
  <script src="app/inlasningsfil.js"></script>
  <script src="app/planering.js"></script>
  <script src="app/flyg.js"></script>
  <script src="app/dialog.js"></script>
  <script src="app/viewer.js"></script>
  <script src="app/ui.js"></script>
  <script src="app/texter.js"></script>
  <script src="app/tidsaxel.js"></script>
  <script src="app/spelare.js"></script>
  <script src="app/telefon.js"></script>
  <script src="app/flode.js"></script>
  <script src="app/byggnadsflode.js"></script>
  <script src="app/vyer.js"></script>
</body>
</html>
