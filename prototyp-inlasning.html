<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>PROTOTYP – Inläsningsläget</title>
  <!--
    PROTOTYP – slit och släng (beslut 75 och 102). Inte en del av systemet och byggs inte in i
    dist/. Frågan den ska besvara: känns inläsningsläget rätt – klart, förslag och oplacerat,
    Godta alla, dra och släpp, modellen som växer fram och ångra/gör om?
  -->
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; font-family: "Segoe UI", -apple-system, Arial, sans-serif; font-size: 14px; color: #1f2933; background: #f3f5f7; }
    .topp { height: 56px; display: flex; align-items: center; gap: 24px; padding: 0 18px; background: #fff; border-bottom: 1px solid #dde2e7; }
    .titel b { background: #fff3cd; color: #7a5300; padding: 2px 8px; border-radius: 4px; font-size: 12px; letter-spacing: .04em; margin-right: 8px; }
    .titel { font-size: 16px; font-weight: 600; }
    .titel span { font-weight: 400; color: #6b7785; font-size: 13px; margin-left: 6px; }
    .spelare { margin-left: auto; display: flex; gap: 4px; align-items: center; }
    .spelare button { width: 34px; height: 32px; border: 1px solid #cfd6dd; background: #fff; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .spelare button:disabled { opacity: .35; cursor: default; }
    .spelare select { height: 32px; max-width: 420px; margin-left: 8px; border: 1px solid #cfd6dd; border-radius: 6px; padding: 0 6px; }
    .layout { display: flex; height: calc(100% - 56px); }
    #panel { width: 620px; flex: none; overflow-y: auto; background: #fff; border-right: 1px solid #dde2e7; padding: 14px 18px 40px; }
    .hoger { flex: 1; position: relative; }
    #vy3d { position: absolute; inset: 0; }
    #tom { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8a96a3; font-size: 15px; text-align: center; padding: 40px; }
    #verktyg { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    #verktyg .gn { font-size: 11px; text-transform: uppercase; color: #6b7785; margin: 0 4px 0 10px; }
    .chip { border: 1px solid #cfd6dd; background: #fff; border-radius: 14px; padding: 4px 11px; cursor: pointer; font-size: 12.5px; }
    .chip.pa { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    .chip:disabled { opacity: .4; cursor: default; background: #eef0f2; color: #6b7785; border-color: #dde2e7; }
    #modelltext { position: absolute; left: 12px; right: 12px; bottom: 10px; background: rgba(255,255,255,.9); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
    #infokort { position: absolute; right: 14px; top: 56px; width: 300px; background: #fff; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.15); padding: 12px 14px; }
    #infokort h3 { margin: 0 0 8px; font-size: 15px; }
    #infokort dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; font-size: 13px; }
    #infokort dt { color: #6b7785; }
    #infokort dd { margin: 0; }
    .stang { position: absolute; right: 8px; top: 6px; border: 0; background: none; font-size: 18px; cursor: pointer; color: #6b7785; }

    .byggrad { padding: 6px 0 10px; font-size: 14px; }
    .bricka { font-size: 12px; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
    .bricka.vantar { background: #fff3cd; color: #7a5300; }
    .bricka.pagar { background: #e7f0fd; color: #1f4f9e; }
    .bricka.klar { background: #e3f5e9; color: #1d6b3a; }
    .processlinje { display: flex; gap: 6px; margin-bottom: 14px; }
    .stegknapp { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; border: 1px solid #dde2e7; background: #f7f9fb; border-radius: 8px; padding: 7px 9px; cursor: pointer; font: inherit; }
    .stegknapp.aktiv { border-color: #1f6feb; background: #fff; box-shadow: 0 0 0 2px rgba(31,111,235,.15); }
    .stegknapp:disabled { opacity: .45; cursor: default; }
    .stegknapp .nr, .stegknapp .bock { display: inline-flex; width: 20px; height: 20px; border-radius: 50%; align-items: center; justify-content: center; font-size: 12px; background: #dde2e7; }
    .stegknapp .bock { background: #22b45a; color: #fff; }
    .stegknapp .sn { font-weight: 600; font-size: 13px; }
    .sma { font-size: 11.5px; }
    .f { color: #9a6700; } .o { color: #c0392b; } .k { color: #1d6b3a; }
    .sma .f, .sma .o { margin-right: 6px; }
    h2 { font-size: 18px; margin: 4px 0 10px; }
    h3 { font-size: 14px; margin: 18px 0 8px; }
    .gra { color: #7b8794; font-weight: 400; }
    .ingress { color: #4a5663; }
    .falt { margin-bottom: 14px; }
    .etikett { display: block; font-weight: 600; margin-bottom: 4px; }
    .typer { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
    .typval.av { color: #9aa5b1; }
    .typval i { font-size: 12px; }
    input#bnamn, select#bomrade { font: inherit; padding: 6px 8px; border: 1px solid #cfd6dd; border-radius: 6px; width: 260px; }
    .fel { color: #c0392b; font-size: 13px; margin-top: 4px; }
    .hjalptext { color: #7b8794; font-size: 12.5px; margin-top: 4px; }
    .knapp { font: inherit; border: 1px solid #cfd6dd; background: #fff; border-radius: 6px; padding: 7px 13px; cursor: pointer; }
    .knapp.huvud { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    .knapp.liten { padding: 3px 10px; font-size: 13px; }
    .knapprad { display: flex; gap: 8px; flex-wrap: wrap; }
    .ruta { border: 1px solid #dde2e7; border-radius: 10px; padding: 10px 14px 12px; margin: 12px 0; }
    .ruta h3 { margin-top: 2px; }
    .ruta.prov { background: #fffbea; border-color: #f1e2a8; }
    .ruta.klar { background: #f0faf3; border-color: #bfe5cb; }
    .lagesrad { display: flex; gap: 12px; align-items: center; padding: 8px 10px; background: #f7f9fb; border-radius: 8px; margin-bottom: 6px; }
    .lagesrad .knapp { margin-left: auto; }
    .kort { border: 1px solid #dde2e7; border-left-width: 4px; border-radius: 8px; padding: 7px 10px; margin-bottom: 6px; background: #fff; }
    .kort.forslag { border-left-color: #e0a526; }
    .kort.oplacerad { border-left-color: #d64541; }
    .kort[draggable="true"] { cursor: grab; }
    .kort-titel { font-weight: 600; }
    .kort ul { margin: 4px 0 6px; padding-left: 18px; }
    .kort li { margin: 2px 0; }
    .kort li.utan { color: #a5321f; }
    .kort select { font: inherit; font-size: 13px; padding: 1px 4px; }
    .grepp { color: #a3adb8; margin-right: 6px; }
    .egna { font-size: 12px; color: #6b5a00; background: #fff8dc; display: inline-block; padding: 1px 6px; border-radius: 4px; margin: 2px 0 4px; }
    .oppna { position: sticky; top: -14px; z-index: 2; background: #fff; max-height: 46vh; overflow-y: auto; padding: 0 2px 8px; margin: 0 -2px; border-bottom: 1px solid #dde2e7; box-shadow: 0 8px 10px -10px rgba(0,0,0,.3); }
    .oppna h3:first-child { margin-top: 10px; }
    .planrad { border: 1px solid #dde2e7; border-radius: 8px; padding: 7px 10px; margin-bottom: 4px; cursor: grab; background: #fff; }
    .zon { border: 1px dashed #c9d2db; border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
    .zon-titel { font-weight: 600; margin-bottom: 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip-rum, .chip-inst { border: 1px solid #cfd6dd; border-radius: 6px; padding: 3px 7px; background: #fff; cursor: grab; font-size: 12.5px; }
    .chip-rum.forslag, .chip-inst.forslag { border-style: dashed; border-color: #e0a526; background: #fffaf0; }
    .chip-inst { display: inline-block; margin: 2px 2px 0 0; background: #eef4fe; border-color: #b9cff5; }
    .rutor { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .rumruta { border: 1px solid #e3e8ed; border-radius: 6px; padding: 4px 6px; min-height: 30px; font-size: 12px; background: #fbfcfd; }
    .rumruta.har { background: #fff; border-color: #cfd6dd; }
    .rr-titel { color: #4a5663; }
    .over { outline: 2px solid #1f6feb; outline-offset: 1px; background: #eef4fe !important; }
    body.drar-rum .zon, body.drar-inst .rumruta, body.drar-plan .planrad { border-color: #8db3f3; }
  </style>
</head>
<body>
  <header class="topp">
    <div class="titel"><b>PROTOTYP</b>Inläsningsläget<span>slit och släng · beslut 102 · känns flödet rätt?</span></div>
    <div class="spelare" id="spelare"></div>
  </header>
  <div class="layout">
    <aside id="panel"></aside>
    <div class="hoger">
      <div id="vy3d"></div>
      <div id="tom">Modellen visas när byggnaden har sina plan.<br>Skapa byggnaden och läs in inläsningsfilen till vänster.</div>
      <div id="verktyg" hidden></div>
      <div id="infokort" hidden></div>
      <div id="modelltext"></div>
    </div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="data/hangar.js"></script>
  <script src="data/katalog.js"></script>
  <script src="app/viewer.js"></script>
  <script src="prototyp/inlasning-logik.js"></script>
  <script src="prototyp/exempel-kasern3.js"></script>
  <script src="prototyp/inlasning-sida.js"></script>
</body>
</html>
